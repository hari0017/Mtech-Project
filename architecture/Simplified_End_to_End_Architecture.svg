<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1230" viewBox="0 0 3000 1230">
<title>Simplified end-to-end architecture of genomic sequence classification</title>
<desc>Five main stages cover both implemented workflows: inputs, preprocessing, representation, modeling and prediction, and evaluation and outputs. The web application and DNABERT run independently.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="1500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#183044">GENOMIC SEQUENCE CLASSIFICATION</text>
<text x="1500" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#183044">Simplified end-to-end architecture | Five main stages for the complete project</text>
<rect x="30" y="155" width="560" height="1045" rx="0" fill="#e7f3fc" stroke="#6ba2c4" stroke-width="2"/>
<text x="310" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#183044">1. INPUT DATA</text>
<text x="310" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183044">Sources and user access</text>
<rect x="625" y="155" width="560" height="1045" rx="0" fill="#fff6d7" stroke="#c4aa5b" stroke-width="2"/>
<text x="905" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#183044">2. PREPROCESSING</text>
<text x="905" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183044">Prepare and validate</text>
