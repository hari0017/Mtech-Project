<text x="1500" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#183044">3. REPRESENTATION</text>
<text x="1500" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183044">Convert DNA into model inputs</text>
<rect x="1815" y="155" width="560" height="1045" rx="0" fill="#f1e9fb" stroke="#aa8ac8" stroke-width="2"/>
<text x="2095" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#183044">4. MODELS &amp; PREDICTION</text>
<text x="2095" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183044">Train, select and reuse</text>
