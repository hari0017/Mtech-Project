<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="48" fill="#263744" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start" dominant-baseline="hanging">Pangenome-to-DNABERT architecture</text>
<text x="60" y="108" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" dominant-baseline="hanging">Graph-derived sequence inputs; learning and final evaluation remain separate</text>
<rect x="60" y="190" width="440" height="150" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="280.0" y="225" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">1 | Parse graph</text>
<text x="280.0" y="268" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">H / S / L / P records</text>
<text x="280.0" y="303" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">NetworkX directed graph</text>
<rect x="580" y="190" width="440" height="150" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="800.0" y="225" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">2 | Build DAG</text>
<text x="800.0" y="268" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Contract SCCs</text>
<text x="800.0" y="303" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Sorted member concatenation</text>
<rect x="1100" y="190" width="440" height="150" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="1320.0" y="225" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">3 | Extract paths</text>
<text x="1320.0" y="268" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Capped DFS + random walks</text>
<text x="1320.0" y="303" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Deduplicate node paths</text>
<line x1="500" y1="265" x2="580" y2="265" stroke="#263744" stroke-width="4"/>
<polygon points="580,265 566,256 566,274" fill="#263744"/>
<line x1="1020" y1="265" x2="1100" y2="265" stroke="#263744" stroke-width="4"/>
<polygon points="1100,265 1086,256 1086,274" fill="#263744"/>
<line x1="1320" y1="340" x2="1320" y2="400" stroke="#263744" stroke-width="4"/>
<polygon points="1320,400 1311,386 1329,386" fill="#263744"/>
<rect x="60" y="400" width="1480" height="145" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="800.0" y="435" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">4 | Prepare model inputs</text>
<text x="800.0" y="478" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Concatenate DNA -&gt; overlapping k-mers -&gt; checkpoint token IDs</text>
<text x="800.0" y="513" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">[CLS] + content + [SEP] + padding | input IDs and attention masks</text>
<line x1="530" y1="545" x2="530" y2="595" stroke="#263744" stroke-width="4"/>
<polygon points="530,595 521,581 539,581" fill="#263744"/>
<line x1="1320" y1="545" x2="1320" y2="595" stroke="#263744" stroke-width="4"/>
<polygon points="1320,595 1311,581 1329,581" fill="#263744"/>
<rect x="60" y="595" width="940" height="145" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="530.0" y="630" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">5A | Verified labels and grouped split</text>
<text x="530.0" y="673" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Group identical encoded inputs; reject conflicting labels</text>
<text x="530.0" y="708" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Train ~56% | Validation ~14% | Test ~30%</text>
<rect x="1100" y="595" width="440" height="145" rx="16" fill="#f4f6f8" stroke="#286f73" stroke-width="3"/>
<text x="1320.0" y="630" fill="#286f73" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">5B | Inference only</text>
<text x="1320.0" y="673" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Load trained checkpoint</text>
<text x="1320.0" y="708" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Reuse recorded threshold</text>
<line x1="200" y1="740" x2="200" y2="790" stroke="#263744" stroke-width="4"/>
<polygon points="200,790 191,776 209,776" fill="#263744"/>
<line x1="1320" y1="740" x2="1320" y2="990" stroke="#263744" stroke-width="4"/>
<polygon points="1320,990 1311,976 1329,976" fill="#263744"/>
<rect x="60" y="790" width="280" height="140" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="200.0" y="825" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Train</text>
<text x="200.0" y="868" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Update weights</text>
<text x="200.0" y="903" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Training data only</text>
<rect x="390" y="790" width="280" height="140" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="530.0" y="825" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Validate</text>
<text x="530.0" y="868" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Choose F1</text>
<text x="530.0" y="903" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">threshold</text>
<rect x="720" y="790" width="280" height="140" rx="16" fill="#f4f6f8" stroke="#ad4d30" stroke-width="3"/>
<text x="860.0" y="825" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Test</text>
<text x="860.0" y="868" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Fixed threshold</text>
<text x="860.0" y="903" fill="#263744" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">Final metrics</text>
<line x1="340" y1="860" x2="390" y2="860" stroke="#263744" stroke-width="4"/>
<polygon points="390,860 376,851 376,869" fill="#263744"/>
<line x1="670" y1="860" x2="720" y2="860" stroke="#263744" stroke-width="4"/>
<polygon points="720,860 706,851 706,869" fill="#263744"/>
<rect x="1100" y="990" width="440" height="90" rx="16" fill="#f4f6f8" stroke="#286f73" stroke-width="3"/>
<text x="1320.0" y="1025" fill="#286f73" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Predictions</text>
<text x="530" y="1000" fill="#ad4d30" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="central">Save: model + tokenizer + experiment.json</text>
<text x="530" y="1044" fill="#263744" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">Inference metrics require matching verified labels</text>
</svg>